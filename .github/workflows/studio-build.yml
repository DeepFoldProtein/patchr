name: Studio Electron Build

on:
  push:
    tags:
      - "studio-v*"
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: studio
        run: pnpm install --frozen-lockfile

      - name: Build Electron app
        working-directory: studio
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm build:mac
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: patchr-studio-macos
          # latest-mac.yml + *.blockmap are required for electron-updater to
          # detect and download updates. The .zip (not the .dmg) is the update
          # payload on macOS.
          path: |
            studio/dist/*.dmg
            studio/dist/*.zip
            studio/dist/latest-mac.yml
            studio/dist/*.blockmap

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: studio
        run: pnpm install --frozen-lockfile

      - name: Build Electron app
        working-directory: studio
        env:
          CSC_LINK: ${{ secrets.WIN_CERTIFICATE_PFX }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
        run: pnpm build:win
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: patchr-studio-windows
          # latest.yml + *.blockmap are required for electron-updater on Windows.
          path: |
            studio/dist/*.exe
            studio/dist/latest.yml
            studio/dist/*.blockmap

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: studio
        run: pnpm install --frozen-lockfile

      - name: Build Electron app
        working-directory: studio
        run: pnpm build:linux
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: patchr-studio-linux
          # latest-linux.yml is required for electron-updater on Linux (AppImage).
          path: |
            studio/dist/*.AppImage
            studio/dist/*.deb
            studio/dist/latest-linux.yml

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
